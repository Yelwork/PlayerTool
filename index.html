<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRPG 戰役助手 - Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { 'campaign-dark': '#2c3e50', 'excel-bg': '#e5dfd3', 'excel-border': '#1a1a1a' } } } }
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f1ea; }
        .tab-content { display: none; } .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        /* 針對地圖深色捲軸優化 */
        .dark-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .dark-scrollbar::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">
    <header class="bg-campaign-dark text-white shadow-md z-10 flex-shrink-0">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider"><i class="fa-solid fa-dragon mr-2"></i>戰役助手：礦坑 & 冰塔峰</h1>
        </div>
        <nav class="container mx-auto px-2 flex space-x-1 overflow-x-auto custom-scrollbar pb-1">
            <button onclick="switchTab('tab-story')" class="tab-btn active bg-white text-campaign-dark px-4 py-2 rounded-t-lg font-bold whitespace-nowrap"><i class="fa-solid fa-clipboard-list mr-2"></i>任務板</button>
            <button onclick="switchTab('tab-locations')" class="tab-btn bg-gray-700 text-gray-300 px-4 py-2 rounded-t-lg whitespace-nowrap"><i class="fa-solid fa-map-pin mr-2"></i>地點與NPC</button>
            <button onclick="switchTab('tab-map')" class="tab-btn bg-gray-700 text-gray-300 px-4 py-2 rounded-t-lg whitespace-nowrap"><i class="fa-solid fa-map mr-2"></i>地圖與迷霧</button>
            <button onclick="switchTab('tab-spells')" class="tab-btn bg-gray-700 text-gray-300 px-4 py-2 rounded-t-lg whitespace-nowrap"><i class="fa-solid fa-wand-magic-sparkles mr-2"></i>法術庫</button>
            <button onclick="switchTab('tab-store')" class="tab-btn bg-gray-700 text-gray-300 px-4 py-2 rounded-t-lg whitespace-nowrap"><i class="fa-solid fa-store mr-2"></i>萬物商店</button>
            <button onclick="switchTab('tab-tools')" class="tab-btn bg-gray-700 text-gray-300 px-4 py-2 rounded-t-lg whitespace-nowrap"><i class="fa-solid fa-swords mr-2"></i>先攻助手</button>
            <button onclick="switchTab('tab-weapons')" class="tab-btn bg-gray-700 text-gray-300 px-4 py-2 rounded-t-lg whitespace-nowrap"><i class="fa-solid fa-khanda mr-2"></i>武器庫</button>
            <button onclick="switchTab('tab-links')" class="tab-btn bg-gray-700 text-gray-300 px-4 py-2 rounded-t-lg whitespace-nowrap"><i class="fa-solid fa-link mr-2"></i>有用連結</button>
        </nav>
    </header>

    <main class="flex-grow overflow-y-auto custom-scrollbar p-4 relative" id="main-content">
        <!-- 任務板 -->
        <div id="tab-story" class="tab-content active max-w-[1400px] mx-auto space-y-4">
            <div class="flex gap-2 flex-wrap mb-2 bg-white p-3 rounded-xl shadow-sm border items-center justify-between">
                <div class="flex gap-2 flex-wrap">
                    <button onclick="renderQuests('All')" class="quest-btn px-3 py-1 bg-green-600 text-white rounded text-sm font-bold shadow-sm transition">全部</button>
                    <button onclick="renderQuests('Main')" class="quest-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold shadow-sm transition">礦坑主線</button>
                    <button onclick="renderQuests('Side')" class="quest-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold shadow-sm transition">礦坑支線</button>
                    <button onclick="renderQuests('DoIP')" class="quest-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold shadow-sm transition">冰塔峰擴充</button>
                </div>
                <input type="text" id="quest-search" placeholder="搜尋任務..." class="px-3 py-1.5 border rounded text-sm outline-none focus:ring-2 w-full sm:w-auto" onkeyup="renderQuests()">
            </div>
            <div id="quests-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 pb-10"></div>
        </div>

        <!-- 地點與 NPC -->
        <div id="tab-locations" class="tab-content max-w-6xl mx-auto">
            <div class="mb-4 flex gap-2">
                <input type="text" id="loc-search" placeholder="搜尋地點或 NPC..." class="w-full md:w-1/3 px-3 py-1.5 border rounded-full text-sm shadow-inner outline-none focus:ring-2 focus:ring-blue-400" onkeyup="renderLocs()">
            </div>
            <div id="locations-container" class="space-y-6 pb-10"></div>
        </div>

        <!-- 地圖與迷霧 (新增的獨立分頁) -->
        <div id="tab-map" class="tab-content max-w-[1600px] mx-auto h-[82vh] flex-col rounded-xl shadow-lg border border-gray-300 overflow-hidden bg-white">
            <!-- 頂部控制列 -->
            <div class="bg-gray-100 p-3 border-b flex flex-wrap justify-between items-center z-20 relative gap-3">
                <div class="flex gap-4 items-center">
                    <h3 class="font-bold text-gray-800"><i class="fa-solid fa-map mr-2 text-indigo-600"></i>DM 迷霧地圖板</h3>
                    
                    <label class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded cursor-pointer text-sm font-bold shadow transition flex items-center">
                        <i class="fa-solid fa-file-image mr-2"></i> 上傳地圖切片 (可多選)
                        <input type="file" multiple accept="image/*" class="hidden" onchange="handleMapUpload(event)">
                    </label>

                    <div class="h-6 w-px bg-gray-300 mx-1 hidden md:block"></div>
                    
                    <!-- 模式切換開關 -->
                    <div class="flex bg-gray-200 rounded p-1 border shadow-inner">
                        <button id="mode-move" onclick="setMapMode('move')" class="px-3 py-1 rounded text-sm font-bold bg-white shadow text-blue-600 transition flex items-center"><i class="fa-solid fa-hand-holding mr-1.5"></i>拖曳排列</button>
                        <button id="mode-fog" onclick="setMapMode('fog')" class="px-3 py-1 rounded text-sm font-bold text-gray-500 hover:text-gray-800 transition flex items-center"><i class="fa-solid fa-eye-slash mr-1.5"></i>點擊解開迷霧</button>
                    </div>
                </div>
                
                <button onclick="clearMapBoard()" class="text-sm bg-red-100 text-red-700 px-3 py-1.5 rounded hover:bg-red-200 font-bold transition flex items-center"><i class="fa-solid fa-trash-can mr-1.5"></i>清空畫布</button>
            </div>
            
            <!-- 巨大畫布區塊 (允許內部捲動) -->
            <div class="flex-grow bg-[#1a1a1a] relative overflow-auto custom-scrollbar dark-scrollbar h-full w-full">
                <div id="map-board" class="w-[3000px] h-[3000px] relative bg-[radial-gradient(#334155_1px,transparent_1px)] [background-size:25px_25px]">
                    <!-- 初始提示文字 -->
                    <div id="map-hint" class="absolute inset-0 flex items-center justify-center text-gray-500 pointer-events-none flex-col mt-[-1000px] ml-[-1000px] w-screen h-screen">
                        <i class="fa-regular fa-images text-5xl mb-4 opacity-50"></i>
                        <p class="text-lg font-bold">點擊上方按鈕上傳切割好的地圖房間</p>
                        <p class="text-sm mt-2">在「拖曳排列」模式下拼湊地圖 <b>(對著圖片滾動滑鼠滾輪可自由縮放大小)</b>，跑團時切換至「解開迷霧」模式點擊開圖。</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 法術庫速查 -->
        <div id="tab-spells" class="tab-content max-w-6xl mx-auto">
            <div class="bg-white p-5 rounded-xl shadow border">
                <h3 class="text-xl font-bold mb-3 border-b pb-2 flex justify-between items-center"><span class="text-campaign-dark"><i class="fa-solid fa-wand-magic-sparkles mr-2 text-purple-600"></i>法術庫速查 (0~9環)</span></h3>
                <div class="flex flex-wrap gap-2 mb-4 items-center bg-purple-50 p-2 rounded border border-purple-100">
                    <button onclick="renderSpells('All')" class="spell-btn px-3 py-1 bg-purple-600 text-white rounded text-sm font-bold">全部</button>
                    <button onclick="renderSpells(0)" class="spell-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">戲法</button>
                    <button onclick="renderSpells(1)" class="spell-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">1環</button>
                    <button onclick="renderSpells(2)" class="spell-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">2環</button>
                    <button onclick="renderSpells(3)" class="spell-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">3環</button>
                    <button onclick="renderSpells(4)" class="spell-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">4環</button>
                    <button onclick="renderSpells(5)" class="spell-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">5環</button>
                    <button onclick="renderSpells(6)" class="spell-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">6環</button>
                    <button onclick="renderSpells(7)" class="spell-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">7環</button>
                    <button onclick="renderSpells(8)" class="spell-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">8環</button>
                    <button onclick="renderSpells(9)" class="spell-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">9環</button>
                    <input type="text" id="spell-search" placeholder="搜尋法術..." class="px-3 py-1 border rounded text-sm ml-auto outline-none w-full md:w-48 mt-2 md:mt-0" onkeyup="renderSpells()">
                </div>
                <div class="overflow-y-auto max-h-[600px] border rounded custom-scrollbar shadow-inner"><table class="w-full text-sm text-left"><thead class="bg-gray-800 text-white sticky top-0 z-10"><tr><th class="px-3 py-2">名稱</th><th class="px-2 py-2 text-center">環</th><th class="px-2 py-2 text-center">距離</th><th class="px-2 py-2 text-center">成分</th><th class="px-3 py-2 w-1/3">效果描述</th><th class="px-3 py-2 text-red-300">傷害/效果</th></tr></thead><tbody id="spell-table-body" class="bg-white divide-y"></tbody></table></div>
            </div>
        </div>

        <!-- 萬物商店速查 -->
        <div id="tab-store" class="tab-content max-w-6xl mx-auto">
            <div class="bg-white p-5 rounded-xl shadow border">
                <h3 class="text-xl font-bold mb-3 border-b pb-2"><i class="fa-solid fa-store mr-2 text-blue-600"></i>萬物商店速查</h3>
                <div class="flex flex-wrap gap-2 mb-4 items-center bg-gray-50 p-2 rounded border">
                    <button onclick="renderStore('All')" class="store-btn px-3 py-1 bg-blue-600 text-white rounded text-sm font-bold">全部</button>
                    <button onclick="renderStore('Gear')" class="store-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">裝備</button>
                    <button onclick="renderStore('Weapon')" class="store-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">武器</button>
                    <button onclick="renderStore('Magic')" class="store-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">魔法/藥水</button>
                    <input type="text" id="store-search" placeholder="搜尋物品..." class="px-3 py-1 border rounded text-sm ml-auto outline-none w-full md:w-48 mt-2 md:mt-0" onkeyup="renderStore()">
                </div>
                <div class="overflow-y-auto max-h-[600px] border rounded custom-scrollbar shadow-inner"><table class="w-full text-sm text-left"><thead class="bg-gray-800 text-white sticky top-0 z-10"><tr><th class="px-3 py-2">物品名稱</th><th class="px-3 py-2 text-yellow-400">價格</th><th class="px-2 py-2 text-center text-xs">村莊</th><th class="px-2 py-2 text-center text-xs">城鎮</th><th class="px-2 py-2 text-center text-xs">城市</th><th class="px-3 py-2 text-xs text-gray-400">分類</th></tr></thead><tbody id="store-table-body" class="bg-white divide-y"></tbody></table></div>
            </div>
        </div>

        <!-- 武器庫速查 (新增) -->
        <div id="tab-weapons" class="tab-content max-w-6xl mx-auto">
            <div class="bg-white p-5 rounded-xl shadow border">
                <h3 class="text-xl font-bold mb-3 border-b pb-2"><i class="fa-solid fa-khanda mr-2 text-red-700"></i>常用武器庫 (D&D 5e)</h3>
                <div class="flex flex-wrap gap-2 mb-4 items-center bg-red-50 p-2 rounded border border-red-200">
                    <button onclick="renderWeapons('All')" class="wpn-btn px-3 py-1 bg-red-700 text-white rounded text-sm font-bold">全部</button>
                    <button onclick="renderWeapons('簡易近戰')" class="wpn-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">簡易近戰</button>
                    <button onclick="renderWeapons('簡易遠程')" class="wpn-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">簡易遠程</button>
                    <button onclick="renderWeapons('軍用近戰')" class="wpn-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">軍用近戰</button>
                    <button onclick="renderWeapons('軍用遠程')" class="wpn-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">軍用遠程</button>
                    <input type="text" id="wpn-search" placeholder="搜尋武器或屬性..." class="px-3 py-1 border rounded text-sm ml-auto outline-none w-full md:w-48 mt-2 md:mt-0" onkeyup="renderWeapons()">
                </div>
                <div class="overflow-y-auto max-h-[600px] border rounded custom-scrollbar shadow-inner">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-gray-800 text-white sticky top-0 z-10">
                            <tr>
                                <th class="px-3 py-2 w-1/4">武器名稱</th>
                                <th class="px-3 py-2 text-center text-red-400 w-1/6">傷害</th>
                                <th class="px-2 py-2 text-center w-1/6">類型</th>
                                <th class="px-3 py-2 w-1/3">屬性 (Properties)</th>
                                <th class="px-2 py-2 text-center text-xs text-yellow-400">價格</th>
                            </tr>
                        </thead>
                        <tbody id="weapons-table-body" class="bg-white divide-y"></tbody>
                    </table>
                </div>
            </div>
        </div>
	<!-- 有用連結 (新增) -->
        <div id="tab-links" class="tab-content max-w-6xl mx-auto">
            <div class="bg-white p-5 rounded-xl shadow border">
                <h3 class="text-xl font-bold mb-4 border-b pb-2"><i class="fa-solid fa-link mr-2 text-indigo-600"></i>有用連結</h3>
                <div id="links-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 pb-4"></div>
            </div>
        </div>
        <!-- DM 工具 (戰鬥先攻助手) -->
        <div id="tab-tools" class="tab-content max-w-4xl mx-auto">
            <div class="pb-10">
                <div class="bg-white p-5 rounded-xl shadow border flex flex-col h-[38rem]">
                    <h3 class="text-lg font-bold mb-3 border-b pb-2 flex justify-between"><span><i class="fa-solid fa-swords mr-2 text-red-600"></i>戰鬥先攻助手</span><button onclick="cmbs=[];renderCmb();" class="text-xs bg-red-100 text-red-700 px-2 rounded hover:bg-red-200 font-bold transition">清空列表</button></h3>
                    <div class="flex gap-1 mb-4 bg-gray-50 p-2 rounded border">
                        <input type="number" id="c-init" placeholder="先攻" class="w-1/6 px-1 border rounded text-center font-bold outline-none focus:border-blue-500">
                        <input type="text" id="c-name" placeholder="名稱" class="w-1/3 px-2 border rounded font-bold outline-none focus:border-blue-500">
                        <input type="number" id="c-ac" placeholder="AC" class="w-1/6 px-1 border rounded text-center text-blue-800 font-bold outline-none">
                        <input type="number" id="c-hp" placeholder="HP" class="w-1/6 px-1 border rounded text-center text-red-600 font-bold outline-none">
                        <select id="c-fac" class="w-1/6 px-1 border rounded text-xs outline-none font-bold"><option value="e">敵方</option><option value="p">友方</option></select>
                        <button onclick="addCmb()" class="bg-green-600 text-white px-3 py-1.5 rounded font-black hover:bg-green-700">+</button>
                    </div>
                    <div class="text-[11px] text-gray-400 mb-2 border-b pb-1">💡 點擊數字可直接修改，修改先攻數值會自動重新排序。</div>
                    <div class="flex-grow overflow-y-auto custom-scrollbar space-y-2 pr-1" id="combat-list"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // =========================================================================
        // 🔴 DATA ZONE (資料區塊) - 您可以在這裡輕鬆新增您的專屬資料！
        // =========================================================================
        /* 
         * 📝 【新增資料教學】
         * 只要照著原本的格式，複製其中一行 { ... }，貼到下一行並修改內容即可。
         * ⚠️ 注意：每一個項目 (大括號) 之間，一定要用半形逗號 `,` 隔開喔！
         */

        // 📜 1. 任務資料 (quests)
        // 欄位說明：n(任務名), ty(分類:Main/Side/DoIP), src(委託人), d(描述), obj(任務目標,可寫多個), rw(報酬)
         let quests = [
  // ==========================================
    // 🌲 凡戴爾的失落礦坑 (主線任務)
    // ==========================================
    { id: "m1", ty: "Main", n: "運送物資到凡戴爾", src: "剛德倫·尋岩者", d: "將裝滿補給品的馬車從絕冬城安全護送到凡戴爾的巴森雜貨店。", obj: ["擊退哥布林伏擊", "將馬車送達雜貨店"], rw: "每人 10 gp" },
    { id: "m2", ty: "Main", n: "營救席爾達", src: "主線劇情", d: "席爾達被耶米克挾持在碎顎據點深處，必須將他活著救出來。", obj: ["潛入碎顎據點", "與耶米克交涉或擊敗他", "護送席爾達回凡戴爾"], rw: "50 gp" },
    { id: "m3", ty: "Main", n: "解決紅印幫的威脅", src: "哈賓 / 席爾達", d: "紅印幫惡棍在鎮上橫行霸道，必須搗毀他們位於特雷森莊園地下的老巢。", obj: ["找到地下室入口", "擊敗首領玻璃杖(伊阿諾)"], rw: "200 gp" },
    { id: "m4", ty: "Main", n: "尋找碎顎城堡", src: "席爾達", d: "剛德倫與失落礦坑的地圖被轉移到了碎顎城堡，必須找到城堡位置並營救他。", obj: ["救出剛德倫"], rw: "迴音洞穴情報" },
    { id: "m5", ty: "Main", n: "探索迴音洞穴", src: "剛德倫", d: "直搗失落礦坑的深處，阻止黑蜘蛛掌控星月熔爐的力量。", obj: [ "救出努恩卓","????????"], rw: "????????" },

    // ==========================================
    // 🏘️ 凡戴爾的失落礦坑 (支線任務)
    // ==========================================
    { id: "s1", ty: "Side", n: "老貓頭鷹井的死靈", src: "達蘭·埃德馬斯", d: "有傳言說老貓頭鷹井的廢墟附近有不死生物出沒，前往調查原因。", obj: ["前往廢墟", "與紅袍法師哈蒙交涉"], rw: "????????" },
    { id: "s2", ty: "Side", n: "說服女妖阿嘉莎", src: "修女 蓋瑞爾", d: "帶著鑲寶石的銀梳子前往康尼貝利，向女妖詢問一本名叫《博文特爾的法術書》的法術書下落。", obj: ["找到阿嘉莎的居所", "成功贈禮並問出情報"], rw: "3 瓶治療藥水" },
    { id: "s3", ty: "Side", n: "錐形塔的半獸人", src: "鎮長 哈賓", d: "一群半獸人佔據了錐形塔的洞穴，威脅著東邊的商道，必須將其剿滅。", obj: ["前往錐形塔", "擊敗頭目"], rw: "100 gp" },
    { id: "s4", ty: "Side", n: "雷樹村尋找雷道斯", src: "奎林 (農婦)", d: "前往廢棄的雷樹村尋找老德魯伊雷道斯。", obj: ["找到雷道斯", "????????"], rw: "碎顎城堡的具體位置" },

        function handleMapUpload(event) {
            const files = event.target.files;
            if(!files.length) return;
            
            const hint = $('map-hint');
            if(hint) hint.style.display = 'none';

            // 確保切換到排列模式以方便剛上傳的地圖可以拖曳
            setMapMode('move');

            Array.from(files).forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    createMapPiece(e.target.result, index);
                };
                reader.readAsDataURL(file);
            });
            event.target.value = ''; // 清空 input 讓下次可以選同樣的檔案
        }

        function createMapPiece(imgSrc, index) {
            const board = $('map-board');
            const piece = document.createElement('div');
            
            // 基礎樣式 (包含黑色邊框幫助對齊)
            piece.className = 'map-piece absolute shadow-2xl border-2 border-[#000] group select-none bg-black';
            piece.style.left = (50 + (index * 40)) + 'px';
            piece.style.top = (50 + (index * 40)) + 'px';
            piece.style.zIndex = zIndexCounter++;
            piece.style.cursor = mapMode === 'move' ? 'grab' : 'crosshair';
            
            piece.innerHTML = `
                <img src="${imgSrc}" class="block pointer-events-none select-none" style="width: 400px; height: auto;" draggable="false">     
           
                <!-- 迷霧層 (預設蓋住) -->
                <div class="fog-mask absolute inset-0 bg-black transition-all duration-500 ease-in-out flex items-center justify-center opacity-100 z-10 border border-gray-800 pointer-events-none">
                    <i class="fa-solid fa-eye-slash text-gray-700 text-3xl md:text-5xl drop-shadow-md"></i>
                </div>
                
                <!-- 刪除按鈕 (Hover時顯示) -->
                <button class="absolute -top-3 -right-3 bg-red-600 text-white rounded-full w-7 h-7 flex items-center justify-center text-xs shadow-lg hover:bg-red-700 z-20 opacity-0 group-hover:opacity-100 transition-opacity btn-delete">
                    <i class="fa-solid fa-times"></i>
                </button>
            `;

            // 刪除事件
            piece.querySelector('.btn-delete').onclick = (e) => {
                e.stopPropagation(); // 避免觸發拖曳或點擊
                piece.remove();
                if(board.querySelectorAll('.map-piece').length === 0) {
                    $('map-hint').style.display = 'flex';
                }
            };

// 滾輪縮放事件 (修正比例縮放)
            piece.onwheel = (e) => {
                if (mapMode !== 'move') return;
                e.preventDefault();
                
                const img = piece.querySelector('img');
                
                // 取得當前圖片的實際寬高
                let currentWidth = img.offsetWidth;
                let currentHeight = img.offsetHeight;
                
                // 設定縮放比例 (向上滾放大 1.1 倍，向下滾縮小 0.9 倍)
                let scale = e.deltaY > 0 ? 0.9 : 1.1; 
                
                let newWidth = currentWidth * scale;
                let newHeight = currentHeight * scale;
                
                // 限制最小寬度避免縮到消失
                if (newWidth < 100) {
                    newHeight = (100 / currentWidth) * currentHeight;
                    newWidth = 100;
                }
                
                // 同時強制寫入 外層容器(piece) 與 內部圖片(img) 的 Width 與 Height
                piece.style.width = newWidth + 'px';
                piece.style.height = newHeight + 'px';
                img.style.width = '100%';
                img.style.height = '100%';
            };

            // 拖曳與點擊事件
            let isDragging = false;
            let startX, startY, initialL, initialT;

            piece.onmousedown = (e) => {
                if(e.button !== 0) return; // 確保只有左鍵觸發
                if(e.target.closest('.btn-delete')) return; // 點擊刪除按鈕不觸發
                
                piece.style.zIndex = zIndexCounter++; // 點擊的板塊移到最上層

                // 若為「迷霧模式」，則不進行拖曳，而是切換迷霧顯示狀態
                if(mapMode === 'fog') {
                    const mask = piece.querySelector('.fog-mask');
                    // 切換 opacity 讓迷霧消失或出現
                    if(mask.classList.contains('opacity-100')) {
                        mask.classList.replace('opacity-100', 'opacity-0');
                        mask.classList.add('bg-opacity-0');
                    } else {
                        mask.classList.replace('opacity-0', 'opacity-100');
                        mask.classList.remove('bg-opacity-0');
                    }
                    return; // 結束，不觸發後續拖曳邏輯
                }

                // 若為「排列模式」，開始拖曳
                if(mapMode === 'move') {
                    isDragging = true;
                    startX = e.clientX;
                    startY = e.clientY;
                    initialL = parseInt(piece.style.left) || 0;
                    initialT = parseInt(piece.style.top) || 0;
                    piece.style.cursor = 'grabbing';
                    
                    document.onmousemove = (eMove) => {
                        if(!isDragging) return;
                        piece.style.left = (initialL + (eMove.clientX - startX)) + 'px';
                        piece.style.top = (initialT + (eMove.clientY - startY)) + 'px';
                    };
                    
                    document.onmouseup = () => {
                        isDragging = false;
                        if(mapMode === 'move') piece.style.cursor = 'grab';
                        document.onmousemove = null;
                        document.onmouseup = null;
                    };
                }
            };

		board.appendChild(piece);
            
            // 確保剛上傳時，外層(Mask)與內層(img)的寬高完全對齊並鎖死
            const imgEl = piece.querySelector('img');
            imgEl.onload = () => {
                piece.style.width = imgEl.offsetWidth + 'px';
                piece.style.height = imgEl.offsetHeight + 'px';
                imgEl.style.width = '100%';
                imgEl.style.height = '100%';
            };
        }

            document.querySelectorAll('.quest-btn').forEach(b => b.classList.remove('bg-green-600','bg-blue-600','text-white'));
            const act = document.querySelector(`.quest-btn[onclick*="'${f}'"]`); 
            if(act) act.classList.add(f==='DoIP'?'bg-blue-600':'bg-green-600', 'text-white');
            
            const arr = quests.filter(x => (f==='All'||x.ty===f) && (x.n.toLowerCase().includes(q) || x.d.toLowerCase().includes(q)));
            setH('quests-container', arr.map(x => {
                const bc = x.ty==='DoIP'?'border-blue-500':x.ty==='Main'?'border-amber-500':'border-green-500';
                let objList = '';
                if(Array.isArray(x.obj)) { objList = x.obj.map(o=>`<li>${o}</li>`).join(''); } 
                else if(x.obj) { objList = `<li>${x.obj}</li>`; }

                return `<div class="bg-white rounded-xl shadow-sm p-5 border-l-4 ${bc} hover:shadow-md transition flex flex-col h-full"><div class="flex justify-between items-start mb-3"><h4 class="font-bold text-lg text-gray-800 leading-tight pr-2">${x.n}</h4><span class="text-[10px] bg-gray-100 text-gray-600 px-2 py-1 rounded font-bold border whitespace-nowrap shrink-0"><i class="fa-solid fa-user mr-1"></i>${x.src}</span></div><p class="text-sm text-gray-600 mb-4 leading-relaxed flex-grow">${x.d}</p><div class="text-xs font-bold text-gray-700 mb-4 bg-gray-50 p-2.5 rounded border border-gray-100 shadow-inner">🎯 任務目標:<ul class="list-disc pl-5 font-normal mt-1.5 space-y-1 text-gray-600">${objList}</ul></div><div class="mt-auto pt-4 border-t"><div class="text-xs text-yellow-700 bg-yellow-50 px-2.5 py-1.5 rounded border border-yellow-200 font-bold shadow-sm w-fit"><i class="fa-solid fa-coins mr-1"></i>報酬: ${x.rw}</div></div></div>`;
            }).join(''));
        }

        function renderLocs() {
            const q = getV('loc-search')?.toLowerCase() || '';
            setH('locations-container', locs.filter(l => l.n.toLowerCase().includes(q) || l.nl?.some(n=>n.n.toLowerCase().includes(q))).map(l => {
                const bc = l.c===5?'border-blue-500 text-blue-900':(l.c===1?'border-green-400':l.c===2?'border-amber-400':'border-purple-400');
                const npcsH = `<div class="mt-3 grid grid-cols-1 md:grid-cols-2 gap-3">${l.nl?.map(n=>`<div class="p-3 rounded-lg border shadow-sm ${n.b||'bg-gray-50'} text-sm hover:shadow transition"><div class="font-bold flex justify-between items-center text-gray-800 border-b border-gray-200/50 pb-1 mb-1"><span>${n.n}</span><span class="text-[10px] font-bold bg-white/60 px-1.5 py-0.5 rounded shadow-sm text-gray-600">${n.r}</span></div><p class="text-gray-700 text-xs mb-2 leading-relaxed">${n.d}</p><div class="text-[10px] text-gray-600 font-bold bg-white/80 p-1.5 rounded border border-gray-200/50 shadow-inner"><i class="fa-solid fa-comment-dots text-gray-400 mr-1"></i>DM: ${n.i}</div></div>`).join('') || ''}</div>`;
                return `<div class="bg-white rounded-xl shadow-sm p-5 border-l-4 ${bc} hover:shadow-md transition"><div class="flex justify-between items-baseline mb-2"><h4 class="font-bold text-xl text-gray-800"><i class="fa-solid fa-map-location-dot mr-2 opacity-50"></i>${l.n}</h4><span class="text-[10px] font-black text-gray-500 bg-gray-100 px-2 py-1 rounded shadow-inner border">${l.c===5?'DoIP 擴充':`Chapter ${l.c}`}</span></div><p class="text-sm text-gray-600 mb-2 leading-relaxed bg-gray-50 p-2 rounded">${l.d}</p>${npcsH}</div>`;
            }).join(''));
        }
        
        let sF = 'All';
        function renderSpells(f=sF) {
            sF = f; const q = getV('spell-search')?.toLowerCase() || '';
            document.querySelectorAll('.spell-btn').forEach(b => b.classList.remove('bg-purple-600','text-white'));
            const act = document.querySelector(`.spell-btn[onclick*="(${typeof f==='string'?`'${f}'`:f})"]`); 
            if(act) act.classList.add('bg-purple-600', 'text-white');
            setH('spell-table-body', spls.filter(s => (f==='All'||s.l===f) && (s.n.toLowerCase().includes(q) || s.d.toLowerCase().includes(q))).map(s => `<tr class="border-b hover:bg-purple-50 transition"><td class="p-2 font-bold text-purple-900">${s.n}</td><td class="p-2 text-center text-xs font-bold text-gray-600 bg-gray-50 border-x">${s.l===0?'戲法':`Lv.${s.l}`}</td><td class="p-2 text-center text-xs font-semibold text-gray-700">${s.r}</td><td class="p-2 text-center text-[10px] font-bold text-gray-500">${s.c}</td><td class="p-2 text-xs text-gray-600">${s.d}</td><td class="p-2 text-xs text-red-600 font-bold">${s.dmg}</td></tr>`).join(''));
        }

        let stF = 'All';
        function renderStore(f=stF) {
            stF = f; const q = getV('store-search')?.toLowerCase() || '';
            document.querySelectorAll('.store-btn').forEach(b => b.classList.remove('bg-blue-600','text-white'));
            const act = document.querySelector(`.store-btn[onclick*="'${f}'"]`); 
            if(act) act.classList.add('bg-blue-600', 'text-white');
            setH('store-table-body', storeItems.filter(s => (f==='All'||s.ty.includes(f)) && (s.n.toLowerCase().includes(q))).map(s => {
                const ck = v => (v==='✓'||v==='X')?'<i class="fa-solid fa-check text-green-600"></i>':'<i class="fa-solid fa-minus text-gray-300"></i>';
                return `<tr class="border-b hover:bg-blue-50 transition"><td class="p-2 font-bold text-gray-800">${s.n}</td><td class="p-2 text-yellow-600 font-mono font-bold">${s.c}</td><td class="p-2 text-center text-xs bg-gray-50 border-l">${ck(s.v)}</td><td class="p-2 text-center text-xs bg-gray-50">${ck(s.t)}</td><td class="p-2 text-center text-xs bg-gray-50 border-r">${ck(s.ct)}</td><td class="p-2 text-[10px] font-bold text-gray-400 uppercase">${s.ty}</td></tr>`;
            }).join(''));
        }

        let wpnF = 'All';
        function renderWeapons(f=wpnF) {
            wpnF = f; const q = getV('wpn-search')?.toLowerCase() || '';
            document.querySelectorAll('.wpn-btn').forEach(b => b.classList.remove('bg-red-700','text-white'));
            const act = document.querySelector(`.wpn-btn[onclick*="'${f}'"]`); 
            if(act) act.classList.add('bg-red-700', 'text-white');
            setH('weapons-table-body', weapons.filter(w => (f==='All'||w.ty===f) && (w.n.toLowerCase().includes(q) || w.p.toLowerCase().includes(q))).map(w => {
                return `<tr class="border-b hover:bg-red-50 transition"><td class="p-2 font-bold text-gray-800">${w.n}</td><td class="p-2 text-center font-bold text-red-600 bg-red-50/50">${w.d}</td><td class="p-2 text-center text-xs text-gray-600 font-semibold border-x">${w.ty}</td><td class="p-2 text-xs text-gray-600">${w.p}</td><td class="p-2 text-center text-xs text-yellow-600 font-mono font-bold bg-gray-50 border-l">${w.c}</td></tr>`;
            }).join(''));
        }

        let cmbs = [];
        function addCmb() {
            const n = getV('c-name'), i = parseInt(getV('c-init'))||0, hp = parseInt(getV('c-hp'))||10;
            if(n) { cmbs.push({id:Date.now(), n, i, ac:parseInt(getV('c-ac'))||10, hp, f:getV('c-fac')}); $('c-name').value=$('c-init').value=$('c-hp').value=''; renderCmb(); }
        }
        window.modCmb = (id,k,v) => { const c = cmbs.find(x=>x.id===id); if(c){ c[k] = (k==='n')?v:(parseInt(v)||0); renderCmb(); } };
        window.dmgCmb = (id,v) => { const c = cmbs.find(x=>x.id===id); if(c){ c.hp-=(parseInt(v)||0); if(c.hp<0)c.hp=0; renderCmb(); } };
        function renderCmb() {
            cmbs.sort((a,b)=>b.i-a.i);
            setH('combat-list', cmbs.map(c => `<div class="flex items-center justify-between p-2 rounded-lg border ${c.f==='p'?'bg-blue-50 border-blue-200':'bg-red-50 border-red-200'} shadow-sm relative group"><button onclick="cmbs=cmbs.filter(x=>x.id!==${c.id});renderCmb()" class="absolute -top-2 -right-2 bg-gray-800 hover:bg-red-600 text-white rounded-full w-5 h-5 text-[10px] z-10 flex items-center justify-center opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-times"></i></button><div class="flex flex-col items-center justify-center bg-white rounded border px-2 mr-2 py-0.5"><span class="text-[9px] text-gray-400 font-bold uppercase tracking-wider">Init</span><input type="number" value="${c.i}" onchange="modCmb(${c.id},'i',this.value)" class="w-8 text-center bg-transparent text-sm font-black outline-none -mt-0.5"></div><div class="flex flex-col w-1/3"><span class="text-[9px] text-gray-400 font-bold uppercase tracking-wider ml-1">Name</span><input type="text" value="${c.n}" onchange="modCmb(${c.id},'n',this.value)" class="w-full bg-transparent text-sm font-bold outline-none px-1 text-gray-800 -mt-0.5 truncate"></div><div class="flex flex-col items-center justify-center bg-white rounded border px-2 mx-2 py-0.5"><span class="text-[9px] text-blue-400 font-bold uppercase tracking-wider">AC</span><input type="number" value="${c.ac}" onchange="modCmb(${c.id},'ac',this.value)" class="w-8 text-center bg-transparent text-blue-800 text-sm font-bold outline-none -mt-0.5"></div><div class="flex flex-col items-center justify-center bg-white rounded border px-2 py-0.5"><span class="text-[9px] text-red-400 font-bold uppercase tracking-wider">HP</span><input type="number" value="${c.hp}" onchange="modCmb(${c.id},'hp',this.value)" class="w-10 text-center bg-transparent text-red-600 text-sm font-black outline-none -mt-0.5 ${c.hp<=0?'line-through text-gray-400':''}"></div><div class="flex ml-auto pl-2"><input type="number" id="dmg-${c.id}" placeholder="受傷" class="w-12 px-2 py-1 border border-r-0 rounded-l text-xs text-center outline-none focus:border-red-500 font-bold" onkeypress="if(event.key==='Enter'){dmgCmb(${c.id},this.value);this.value='';}"><button onclick="dmgCmb(${c.id},getV('dmg-${c.id}'));$('dmg-${c.id}').value='';" class="bg-red-200 text-red-800 px-3 py-1 rounded-r font-black text-xs hover:bg-red-300 transition shadow-inner">-</button></div></div>`).join(''));
        }
// 渲染連結列表
        function renderLinks() {
            setH('links-container', links.map(l => {
                return `<div class="p-4 border rounded-xl shadow-sm hover:shadow-md transition bg-indigo-50/30 border-indigo-100 flex flex-col h-full justify-between">
                    <h4 class="font-bold text-gray-800 mb-3"><i class="fa-solid fa-bookmark text-indigo-400 mr-2"></i>${l.title}</h4>
                    <a href="${l.url}" target="_blank" class="w-full bg-white border border-indigo-200 text-indigo-700 px-3 py-2 rounded-lg text-sm font-bold text-center hover:bg-indigo-600 hover:text-white transition shadow-sm">
                        <i class="fa-solid fa-arrow-up-right-from-square mr-1.5"></i> 開啟連結
                    </a>
                </div>`;
            }).join(''));
        }

        // 初始化
        window.onload = () => { 
            renderQuests(); 
            renderLocs(); 
            renderSpells(); 
            renderStore(); 
            renderWeapons();
            renderLinks(); // 新增初始化連結
        };
    </script></body>
</html>
